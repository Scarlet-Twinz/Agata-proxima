services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: proxima
      POSTGRES_PASSWORD: proxima-dev-only
      POSTGRES_DB: proxima_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxima -d proxima_dev"]
      interval: 2s
      timeout: 2s
      retries: 15

  proxima:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROXIMA_TENANT_SIGNING_KEY: ${PROXIMA_TENANT_SIGNING_KEY:?Set PROXIMA_TENANT_SIGNING_KEY in .env}
      PROXIMA_NODE_IDENTITY_PATH: /var/lib/agata-proxima/node-identity.json
      PROXIMA_LISTEN_ADDR: 0.0.0.0:6432
      PROXIMA_UPSTREAM_ADDR: postgres:5432
      PROXIMA_DASHBOARD_LISTEN_ADDR: 0.0.0.0:9080
      PROXIMA_DASHBOARD_ENABLED: "true"
      RUST_LOG: proxima_engine=info
      PROXIMA_MAX_CONNECTIONS: 1024
      PROXIMA_UPSTREAM_CONNECT_TIMEOUT_MS: 10000
      PROXIMA_TLS_REQUIRE_CLIENT: "false"
      PROXIMA_UPSTREAM_TLS_MODE: disable
    ports:
      - "6432:6432"
      - "9080:9080"
    volumes:
      - proxima-node-identity:/var/lib/agata-proxima
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9080'"]
      interval: 5s
      timeout: 3s
      retries: 10

  control-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: proxima_control
      POSTGRES_PASSWORD: proxima-control-dev
      POSTGRES_DB: proxima_control
    ports:
      - "${PROXIMA_CONTROL_DB_HOST_PORT:-55443}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxima_control -d proxima_control"]
      interval: 2s
      timeout: 2s
      retries: 15

  proxima-control:
    build:
      context: .
      dockerfile: crates/proxima-control-plane/Dockerfile
    environment:
      PROXIMA_CONTROL_DATABASE_URL: postgres://proxima_control:proxima-control-dev@control-postgres:5432/proxima_control
      PROXIMA_NODE_ENROLLMENT_ENCRYPTION_KEY: ${PROXIMA_NODE_ENROLLMENT_ENCRYPTION_KEY:?Set PROXIMA_NODE_ENROLLMENT_ENCRYPTION_KEY in .env}
      AGATA_WEBHOOK_ENCRYPTION_KEY: ${AGATA_WEBHOOK_ENCRYPTION_KEY:?Set AGATA_WEBHOOK_ENCRYPTION_KEY in .env}
      PROXIMA_CONTROL_BIND: 0.0.0.0:8080
      PROXIMA_COOKIE_SECURE: "false"
      RUST_LOG: proxima_control_plane=info
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:?Set FLUTTERWAVE_SECRET_KEY first}
      FLUTTERWAVE_ENVIRONMENT: ${FLUTTERWAVE_ENVIRONMENT:-production}
      FLUTTERWAVE_STARTER_PLAN_ID: ${FLUTTERWAVE_STARTER_PLAN_ID:-171661}
      FLUTTERWAVE_GROWTH_PLAN_ID: ${FLUTTERWAVE_GROWTH_PLAN_ID:-171662}
      FLUTTERWAVE_SCALE_PLAN_ID: ${FLUTTERWAVE_SCALE_PLAN_ID:-171663}
      FLUTTERWAVE_STARTER_AMOUNT_USD: ${FLUTTERWAVE_STARTER_AMOUNT_USD:-149}
      FLUTTERWAVE_GROWTH_AMOUNT_USD: ${FLUTTERWAVE_GROWTH_AMOUNT_USD:-499}
      FLUTTERWAVE_SCALE_AMOUNT_USD: ${FLUTTERWAVE_SCALE_AMOUNT_USD:-1199}
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      control-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  proxima-node-identity:
