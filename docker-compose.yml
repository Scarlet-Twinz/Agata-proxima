services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: proxima
      POSTGRES_PASSWORD: proxima-dev-only
      POSTGRES_DB: proxima_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxima -d proxima_dev"]
      interval: 2s
      timeout: 2s
      retries: 15

  proxima:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PROXIMA_LISTEN_ADDR: 0.0.0.0:6432
      PROXIMA_UPSTREAM_ADDR: postgres:5432
      PROXIMA_DASHBOARD_LISTEN_ADDR: 0.0.0.0:9080
      PROXIMA_DASHBOARD_ENABLED: "true"
      RUST_LOG: proxima_engine=info
      PROXIMA_MAX_CONNECTIONS: 1024
      PROXIMA_UPSTREAM_CONNECT_TIMEOUT_MS: 10000
      PROXIMA_TLS_REQUIRE_CLIENT: "false"
      PROXIMA_UPSTREAM_TLS_MODE: disable
    ports:
      - "6432:6432"
      - "9080:9080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9080'"]
      interval: 5s
      timeout: 3s
      retries: 10


  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    environment:
      PROXIMA_CONTROL_PLANE_LISTEN_ADDR: 0.0.0.0:9090
      PROXIMA_CONTROL_PLANE_STATE: /var/lib/proxima/control-plane.json
      PROXIMA_CONTROL_PLANE_LOCAL_MODE: "true"
      RUST_LOG: proxima_control_plane=info
    ports:
      - "9090:9090"
    volumes:
      - proxima-control-state:/var/lib/proxima
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/9090'"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  proxima-control-state:
