<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Agata Proxima</title><link rel="stylesheet" href="/platform/styles.css"></head><body><main class="auth"><section class="auth-card"><a class="brand" href="/"><img src="/platform/logo.svg"><span><b>AGATA</b><small>PROXIMA</small></span></a><h1>Build your workspace.</h1><p>Create the first identity in your Proxima control plane.</p><form data-auth="signup"><div class="field"><label>Work email</label><input name="email" type="email" autocomplete="email" required></div><div class="field"><label>Passphrase</label><input name="password" type="password" autocomplete="new-password" minlength="15" required><small class="form-note">15+ characters. Use a password manager.</small></div><button class="btn primary" style="width:100%" type="submit">Create workspace</button></form><p class="form-note">Already have an account? <a href="/login" style="color:var(--cyan)">Sign in</a></p></section></main><div class="toast"></div><script src="/platform/app.js"></script></body></html>
