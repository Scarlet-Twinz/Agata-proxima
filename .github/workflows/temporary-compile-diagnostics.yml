name: Temporary compile diagnostics

on:
  push:
    branches:
      - phase25-40-platform

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture cargo check
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/check.log
      - name: Report
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number')"
          gh pr comment "$PR" --body-file /tmp/check.log
