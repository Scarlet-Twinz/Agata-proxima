name: Supply chain security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit, secret scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Verify SQLx uses only the PostgreSQL backend
        run: |
          grep -Fq 'default-features = false' crates/proxima-control-plane/Cargo.toml
          grep -Fq '"postgres"' crates/proxima-control-plane/Cargo.toml
          if grep -Fq '"mysql"' crates/proxima-control-plane/Cargo.toml; then
            echo "::error::The SQLx MySQL backend must remain disabled while RUSTSEC-2023-0071 is ignored."
            exit 1
          fi

      - name: Audit Rust dependencies
        # RUSTSEC-2023-0071 is only pulled into Cargo.lock by SQLx's optional MySQL driver.
        # The preceding gate proves that driver is not in the active dependency graph.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Generate frontend CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > "$RUNNER_TEMP/frontend-sbom.cdx.json"
        working-directory: frontend

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: agata-proxima-frontend-sbom
          path: ${{ runner.temp }}/frontend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Scan changes for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
