name: Supply chain security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit, secret scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Verify SQLx uses only the PostgreSQL backend
        run: |
          grep -Fq 'default-features = false' crates/proxima-control-plane/Cargo.toml
          grep -Fq '"postgres"' crates/proxima-control-plane/Cargo.toml
          if grep -Fq '"mysql"' crates/proxima-control-plane/Cargo.toml; then
            echo "::error::The SQLx MySQL backend must remain disabled while RUSTSEC-2023-0071 is ignored."
            exit 1
          fi
          if cargo tree --locked -i sqlx-mysql > "$RUNNER_TEMP/sqlx-mysql-tree.txt" 2>&1; then
            echo "::error::SQLx MySQL is present in the active dependency graph; remove the RSA advisory exception or disable MySQL."
            cat "$RUNNER_TEMP/sqlx-mysql-tree.txt"
            exit 1
          elif grep -Fq 'did not match any packages' "$RUNNER_TEMP/sqlx-mysql-tree.txt"; then
            echo "PASS: SQLx MySQL is absent from the active dependency graph."
          else
            cat "$RUNNER_TEMP/sqlx-mysql-tree.txt"
            exit 1
          fi
          test -f docs/security/dependency-advisory-exceptions.md
          grep -q 'RUSTSEC-2023-0071' docs/security/dependency-advisory-exceptions.md

      - name: Audit Rust dependencies
        # RUSTSEC-2023-0071 is only pulled into Cargo.lock by SQLx's optional MySQL driver.
        # The preceding gate proves that driver is not in the active dependency graph.
        run: cargo audit --ignore RUSTSEC-2023-0071

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

      - name: Install integration starter kit dependencies
        run: npm ci
        working-directory: download-kit

      - name: Validate integration SDK, CLI and receiver examples
        run: npm run check
        working-directory: download-kit

      - name: Audit integration starter kit dependencies
        run: npm audit --audit-level=high
        working-directory: download-kit

      - name: Generate frontend CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > "$RUNNER_TEMP/frontend-sbom.cdx.json"
        working-directory: frontend

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: agata-proxima-frontend-sbom
          path: ${{ runner.temp }}/frontend-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"

      - name: Install pinned Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.24.3

      - name: Scan checked-out source for leaked secrets
        run: |
          "$(go env GOPATH)/bin/gitleaks" detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --exit-code 2 \
            --report-format sarif \
            --report-path "$RUNNER_TEMP/gitleaks.sarif"

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agata-proxima-gitleaks-report
          path: ${{ runner.temp }}/gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 30

      - name: Build Engine container image
        run: docker build --pull -f Dockerfile -t agata-proxima-engine:ci .

      - name: Scan Engine container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agata-proxima-engine:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Build Control Plane container image
        run: docker build --pull -f crates/proxima-control-plane/Dockerfile -t agata-proxima-control-plane:ci .

      - name: Scan Control Plane container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agata-proxima-control-plane:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
