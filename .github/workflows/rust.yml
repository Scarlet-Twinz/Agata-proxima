name: Rust

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Format
        run: cargo fmt --all -- --check
