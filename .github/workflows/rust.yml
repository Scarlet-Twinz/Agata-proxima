name: Rust
# Phase 51-59 launch gate: build, test, lint, migrations, API contracts, and acceptance syntax.
# External provider and production acceptance remain separate deployment gates.

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: proxima
          POSTGRES_PASSWORD: proxima-dev-only
          POSTGRES_DB: proxima_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxima -d proxima_dev"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all

      - name: Upload rustfmt-normalized source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-normalized-source
          path: crates/**/*.rs
          if-no-files-found: error

      - name: Frontend install
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend TypeScript and production build
        working-directory: frontend
        run: npm run build

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Check
        run: cargo check --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --all-targets --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verification harness syntax
        run: bash -n tools/proxima-verify.sh tools/proxima-verify-3tenant.sh
      - name: Performance harness syntax
        run: |
          bash -n tests/performance/benchmark-proxy.sh
          python -m py_compile scripts/ops/summarize-pgbench.py
      - name: Monitor Breaker Attest integration contract
        run: bash tests/launch/proxima_monitor_attest_gate.sh

      - name: External SaaS reference syntax
        run: |
          bash -n tests/external-saas/verify_three_tenant.sh
          bash -n tests/external-saas/verify_reference_app.sh
          node --check tests/external-saas/reference-app/server.js

      - name: PostgreSQL RLS verification
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: proxima
          PGPASSWORD: proxima-dev-only
          PGDATABASE: proxima_dev
        run: bash tests/postgres/verify_rls.sh

      - name: Control plane migration verification
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: proxima
          PGPASSWORD: proxima-dev-only
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE proxima_control" || true
          PGDATABASE=proxima_control psql -v ON_ERROR_STOP=1 -f crates/proxima-control-plane/migrations/0001_control_plane.sql
          PGDATABASE=proxima_control psql -v ON_ERROR_STOP=1 -f crates/proxima-control-plane/migrations/0002_production.sql
          PGDATABASE=proxima_control psql -v ON_ERROR_STOP=1 -f crates/proxima-control-plane/migrations/0003_entitlements.sql
          for migration in crates/proxima-control-plane/migrations/*.sql; do
            PGDATABASE=proxima_control psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Control plane OpenAPI JSON
        run: python -m json.tool control-plane/openapi.json >/dev/null

      - name: Production environment contract
        run: |
          grep -q "AGATA_PUBLIC_BASE_URL" .env.example
          grep -q "PADDLE_STARTER_PRICE_ID" .env.example
          grep -q "PADDLE_GROWTH_PRICE_ID" .env.example
          grep -q "PADDLE_SCALE_PRICE_ID" .env.example
          grep -q "PADDLE_API_KEY" .env.example
          grep -q "PADDLE_CLIENT_TOKEN" .env.example
          grep -q "PADDLE_WEBHOOK_SECRET" .env.example
          grep -q "PADDLE_ENVIRONMENT=production" .env.example
          ! grep -q "PADDLE_ENVIRONMENT=sandbox" .env.example
          ! grep -q "PAYSTACK_" .env.example
          ! grep -q "STRIPE_" .env.example
          grep -q "RESEND_API_KEY" .env.example
          grep -q "PROXIMA_OIDC_CLIENT_ID" .env.example
          grep -q "PROXIMA_OIDC_CLIENT_SECRET" .env.example
          grep -q "^RESEND_FROM_EMAIL=$" .env.example
          grep -q "RESEND_FROM_NO_REPLY_EMAIL" .env.example
          grep -q "RESEND_FROM_SUPPORT_EMAIL" .env.example
          grep -q "RESEND_FROM_SECURITY_EMAIL" .env.example
          grep -q "RESEND_FROM_BILLING_EMAIL" .env.example
          grep -q "RESEND_FROM_NOTIFICATIONS_EMAIL" .env.example
          grep -q "AGATA_SUPPORT_INBOX_EMAIL=" .env.example
          grep -q "RESEND_TEMPLATE_VERIFY_EMAIL_ID" .env.example
          grep -q "RESEND_TEMPLATE_PASSWORD_RESET_ID" .env.example
          grep -q "RESEND_TEMPLATE_ORGANIZATION_INVITATION_ID" .env.example
          grep -q "RESEND_TEMPLATE_NEW_LOGIN_ALERT_ID" .env.example
          grep -q "RESEND_TEMPLATE_SUPPORT_REQUEST_RECEIVED_ID" .env.example
          grep -q "RESEND_TEMPLATE_BILLING_UPDATE_ID" .env.example
          ! grep -q "STRIPE_" .env.example

      - name: Control plane operational scripts
        run: |
          bash -n tests/control-plane/api_smoke.sh
          python scripts/ops/check-doc-links.py
          ! grep -R -n "agata-proxima\\.com" README.md .env.example crates/proxima-control-plane/.env.example docs frontend/vercel.json
          bash -n scripts/proxima-platform.sh
          bash -n scripts/ops/check-control-plane.sh scripts/ops/backup-control-plane.sh
          test -f docs/usage.md
          test -f docs/production/operational-readiness-runbook.md
          ! grep -qi 'Stripe webhooks' docs/developer-guide.md
          bash tests/launch/frontend_route_contract.sh

      - name: Paddle Billing integration
        run: bash tests/launch/paddle_billing_gate.sh

      - name: Phase 3.23 transactional email
        run: bash tests/launch/phase3_23_resend_email_gate.sh

      - name: Phase 3.22/3.23 Entra OIDC and Resend contract
        run: bash tests/launch/phase3_22_23_oidc_email_contract.sh

      - name: Phase 3.22-A canonical entitlement contract
        run: bash tests/entitlements/phase322_a_catalog_gate.sh

      - name: Phase 3.22-B capacity enforcement
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: proxima
          PGPASSWORD: proxima-dev-only
          PGDATABASE: postgres
        run: bash tests/entitlements/phase322_b_capacity_gate.sh

      - name: Phase 3.22-C integration quotas
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: proxima
          PGPASSWORD: proxima-dev-only
          PGDATABASE: postgres
        run: bash tests/entitlements/phase322_c_integration_gate.sh

      - name: Phase 3.22-D verification quotas
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: proxima
          PGPASSWORD: proxima-dev-only
          PGDATABASE: postgres
        run: bash tests/entitlements/phase322_d_verification_gate.sh

      - name: Phase 3.22-E audit retention
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: proxima
          PGPASSWORD: proxima-dev-only
          PGDATABASE: postgres
        run: bash tests/entitlements/phase322_e_audit_retention_gate.sh

      - name: Phase 3.22-F team seats
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: proxima
          PGPASSWORD: proxima-dev-only
          PGDATABASE: postgres
        run: bash tests/entitlements/phase322_f_team_seats_gate.sh

      - name: Phase 3.22-G API, enterprise, and support entitlements
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: proxima
          PGPASSWORD: proxima-dev-only
          PGDATABASE: postgres
        run: bash tests/entitlements/phase322_g_api_enterprise_gate.sh

      - name: Phase 3.22-H lifecycle and adversarial regressions
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: proxima
          PGPASSWORD: proxima-dev-only
          PGDATABASE: postgres
        run: bash tests/entitlements/phase322_h_lifecycle_gate.sh

      - name: Phase 58-59 repository launch gate
        run: bash tests/launch/phase58_59_repo_gate.sh
