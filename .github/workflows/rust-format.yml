name: Rust format

on:
  push:
    branches:
      - phase25-40-platform

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all
      - name: Commit formatted Rust
        run: |
          if git diff --quiet; then
            echo "Rust formatting already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: apply rustfmt"
          git push origin HEAD:phase25-40-platform
