[package]
name = "proxima-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agata Proxima security infrastructure engine"
repository = "https://github.com/Scarlet-Twinz/Agata-proxima"

[dependencies]
bytes = "1"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rustls = "0.23"
rustls-pemfile = "2.2"
tokio-rustls = "0.26"

[dev-dependencies]
proptest = "1"
tokio-postgres = "0.7"
tempfile = "3"
serial_test = "3"
