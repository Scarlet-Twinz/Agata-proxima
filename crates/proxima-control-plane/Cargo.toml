[package]
name = "proxima-control-plane"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agata Proxima hosted control-plane foundation"
repository = "https://github.com/Scarlet-Twinz/Agata-proxima"

[dependencies]
anyhow = "1"
argon2 = "0.6"
axum = "0.8"
rand_core = { version = "0.10", features = ["os_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }
