[package]
name = "proxima-control-plane"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agata Proxima authenticated control plane"

[[bin]]
name = "proxima-control-plane"
path = "src/main.rs"

[dependencies]
argon2 = "0.6"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1.27", features = ["v4", "serde"] }
